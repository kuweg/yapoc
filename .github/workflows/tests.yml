name: Tests

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'conftest.py'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # No API keys are provided, so anything reaching a real provider must be
      # skipped or mocked rather than left to fail the run. The suite is
      # expected to be fully green: it went from 32 failures to 0 in the commit
      # that added this workflow, and a red run here means a real regression.
      - name: Run tests
        env:
          # Keep the access middleware on its local-dev path; conftest.py gives
          # TestClient a loopback identity to match.
          BACKEND_API_TOKEN: ''
        run: poetry run pytest tests/ app/backend/tests/ -q --maxfail=0

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      # Reported, not enforced, for now. CI has no production task history, so
      # the reliability checks will SKIP here (too few tasks) and only the
      # retrieval and telemetry checks carry signal. Flip `continue-on-error`
      # to false once the gate is run against a real window — running it
      # against an empty one and calling that a pass is the failure mode the
      # gate's own min_tasks rule exists to prevent.
      # Offline scenarios are free and model-free: security-gate refusals,
      # core-agent protection, absence of false positives, retrieval baseline.
      # Enforced, unlike the release gate below, because these do not depend on
      # production task history — they either hold or they do not.
      - name: Scenario suite (offline)
        run: poetry run python -m app.utils.scenario_suite --offline

      - name: Release gate
        continue-on-error: true
        run: poetry run python -m app.utils.release_gate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The frontend uses pnpm (app/frontend/pnpm-lock.yaml). `npm ci` would
      # fail here — there is no package-lock.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app/frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: app/frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: app/frontend
        run: pnpm run build
