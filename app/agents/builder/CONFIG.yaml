# NOTE: For agents listed in app/config/agent-settings.json, the values
# below are NOT authoritative at runtime. The runtime config-resolution
# order is:
#   1. app/config/agent-settings.json (adapter, model, temperature,
#      max_tokens, fallbacks, tools — authoritative when present)
#   2. THIS FILE (CONFIG.yaml) — fallback for fields not in agent-settings.json
#   3. NOTES.MD [config] block (legacy)
#   4. app/config/settings.py defaults
# Sandbox + runner blocks are still read from this file at all times.
# If you edit adapter/model here expecting it to apply, ALSO update
# app/config/agent-settings.json.

adapter: deepseek
model: deepseek-chat
temperature: 1.0
tools:
  - file_read
  - file_write
  - file_edit
  - file_delete
  - file_list
  - shell_exec
  - memory_append
  - notes_read
  - notes_write
  - notes_append
  - health_log
  - grep
  - search_negative_knowledge
delegation_targets:
  - keeper
sandbox:
  shell_allowlist:
    - poetry
    - pip
    - python
    - python3
    - git
    - curl
    - wget
    - ls
    - cat
    - grep
    - find
    - mkdir
    - cp
    - mv
    - rm
    - chmod
    - echo
    - cat
    - head
    - tail
    - sort
    - wc
    - uname
    - which
    - npm
    - npx
    - node
    - cargo
    - make
    - cmake
    - docker
    - go
    - rustc
  forbidden:
    - app/agents/master/
    - app/agents/planning/
    - app/agents/builder/
    - app/agents/keeper/
    - app/agents/cron/
    - app/agents/doctor/
    - app/agents/model_manager/
    - app/agents/base/
    - app/config/settings.py
    - .env
    - pyproject.toml
runner:
  max_turns: 15
  task_timeout: 300
  poll_interval: 30
  retry_attempts: 3
  context_memory_limit: 15
  context_health_limit: 5
  context_notes_limit: 3000
