# NOTE: For agents listed in app/config/agent-settings.json, the values
# below are NOT authoritative at runtime. The runtime config-resolution
# order is:
#   1. app/config/agent-settings.json (adapter, model, temperature,
#      max_tokens, fallbacks, tools — authoritative when present)
#   2. THIS FILE (CONFIG.yaml) — fallback for fields not in agent-settings.json
#   3. NOTES.MD [config] block (legacy)
#   4. app/config/settings.py defaults
# Sandbox + runner blocks are still read from this file at all times.
# If you edit adapter/model here expecting it to apply, ALSO update
# app/config/agent-settings.json.

adapter: deepseek
model: deepseek-v4-pro
temperature: 0.3
tools:
  # GitHub read-only grants; keep synchronized with agent-settings.json.
  - github_get_repo
  - github_get_health_summary
  - github_list_issues
  - github_get_issue
  - github_list_pull_requests
  - github_get_pull_request
  - github_list_workflow_runs
  - github_get_workflow_run
  - github_list_workflow_jobs
  # ── Reads (safe, do them yourself) ──────────────────────────────────
  - plugin:drive:*
  - plugin:calendar:*
  - plugin:gmail:*
  - file_read
  - file_list
  - file_write
  - file_edit
  - file_delete
  - show_agent_settings
  - grep
  - shell_exec
  # ── Delegation ──────────────────────────────────────────────────────
  - spawn_agent
  - ping_agent
  - kill_agent
  - wait_for_agent
  - wait_for_agents
  - execute_dag
  - check_task_status
  - read_task_result
  - read_agent_logs
  # ── Agent management ────────────────────────────────────────────────
  - create_agent
  - delete_agent
  # ── Self ────────────────────────────────────────────────────────────
  - server_restart
  - process_restart
  - web_search
  - fetch_page
  - super_fetch_page
  - memory_append
  - notes_read
  - notes_write
  - notes_append
  - health_log
  - agent_amnesia
  - search_memory
  - learnings_append
  - shared_knowledge_append
  - whiteboard_list
  - whiteboard_add_card
  - whiteboard_update_card
  - whiteboard_create_canvas
  - whiteboard_connect
  - whiteboard_apply_design
  - whiteboard_export
  - image_read
  - send_telegram_message
  - send_telegram_media
  - send_telegram_voice
  - delegate_task
  - search_negative_knowledge
  - list_tools
  - render_chart
  - generate_image
  - render_mermaid
  - render_calendar
  # ── Skills ───────────────────────────────────────────────────────────
  - load_skills
  - create_skill
  - update_skill
  - delete_skill
  - execute_code
  # ── Git (inspect, scoped commit, scoped rollback) ──
  - git_status
  - git_diff
  - git_log
  - git_show
  - git_commit
  - git_branch
  - git_restore
sandbox:

runner:
  # task_timeout: 0 means unbounded — master is the autonomous orchestrator
  # and must not be killed by an externally-imposed per-task duration.
  # Sub-agents keep their own task_timeout. Cost control lives in
  # budget_per_agent_usd / budget_per_task_usd (see settings.py).
  task_timeout: 0
  poll_interval: 30
  retry_attempts: 3
  context_memory_limit: 30
  context_health_limit: 10
  context_notes_limit: 5000
  context_learnings_chars: 4000
  context_knowledge_chars: 3000
