# NOTE: Runtime config-resolution differs by field:
#   * adapter / model / temperature / max_tokens / fallbacks:
#       1. app/config/agent-settings.json (authoritative when present)
#       2. THIS FILE (CONFIG.yaml) fallback
#   * tools (see BaseAgent._load_tool_names):
#       1. THIS FILE's `tools:` block is AUTHORITATIVE
#       2. agent-settings.json `tools` is only a fallback when this block is
#          absent — keep the two in sync or an audit of the JSON is misled.
#   * sandbox + runner blocks: always read from THIS file.
#   * NOTES.MD [config] block (legacy) then settings.py defaults.
# If you edit adapter/model here expecting it to apply, ALSO update
# app/config/agent-settings.json.

adapter: deepseek
model: deepseek-chat
temperature: 0.3
tools:
  - file_read
  - file_write
  - file_edit
  - file_delete
  - file_list
  - spawn_agent
  - ping_agent
  - kill_agent
  - wait_for_agent
  - wait_for_agents
  - check_task_status
  - read_task_result
  - notify_parent
  - memory_append
  - notes_read
  - notes_write
  - notes_append
  - health_log
  - add_task_trace
  - search_memory
  - learnings_append
  - shared_knowledge_append
delegation_targets:
  - builder
  - keeper
  - model_manager
runner:
  max_turns: 15
  task_timeout: 600
  poll_interval: 30
  retry_attempts: 3
  context_memory_limit: 20
  context_health_limit: 10
  context_notes_limit: 3000
